name: Deploy Azure Web App Webversion

on:
  push:
    branches:
      - webversion

env:
  NODE_VERSION: '22.12.0'
  AZURE_WEBAPP_NAME: 'azedili'
  AZURE_RESOURCE_GROUP: 'azeridili'
  AZURE_NODE_RUNTIME: 'NODE|22-lts'
  AZURE_STARTUP_COMMAND: 'node node_modules/@react-router/serve/dist/cli.js build/server/index.js'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: webversion
    permissions:
      contents: read
      id-token: write

    if: github.ref == 'refs/heads/webversion'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies (legacy peer deps)
        run: npm ci --legacy-peer-deps

      - name: Typecheck application
        run: npm run typecheck

      - name: Build application
        run: npm run build

      - name: Prepare deployment package (prod install)
        shell: bash
        run: |
          mkdir -p release
          cp package.json package-lock.json release/
          cp -R build release/build
          if [ -d public ]; then
            cp -R public release/public
          fi
          (cd release && npm ci --omit=dev --legacy-peer-deps)
          (cd release && zip -r ../release.zip .)

      - name: Azure login
        uses: azure/login@v3
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_WEBVERSION_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_WEBVERSION_CLIENT_SECRET }}",
              "tenantId": "${{ secrets.AZURE_WEBVERSION_TENANT_ID }}",
              "subscriptionId": "${{ secrets.AZURE_WEBVERSION_SUBSCRIPTION_ID }}"
            }

      - name: Configure Azure Web App runtime
        shell: bash
        run: |
          az webapp config set \
            --name "${{ env.AZURE_WEBAPP_NAME }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --linux-fx-version "${{ env.AZURE_NODE_RUNTIME }}" \
            --startup-file "${{ env.AZURE_STARTUP_COMMAND }}"

          az webapp config appsettings set \
            --name "${{ env.AZURE_WEBAPP_NAME }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --settings \
              AUTH_URL="https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net/api/auth" \
              ENABLE_ORYX_BUILD="false" \
              HOST="0.0.0.0" \
              SCM_DO_BUILD_DURING_DEPLOYMENT="false"

      - name: Ensure Azure Web App is running
        shell: bash
        run: |
          az webapp start \
            --name "${{ env.AZURE_WEBAPP_NAME }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}"

          for attempt in 1 2 3 4 5 6; do
            app_state=$(az webapp show \
              --name "${{ env.AZURE_WEBAPP_NAME }}" \
              --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
              --query state \
              --output tsv)

            if [ "$app_state" = "Running" ]; then
              exit 0
            fi

            if [ "$app_state" = "QuotaExceeded" ]; then
              echo "Azure web app is in 'QuotaExceeded' state. The target App Service plan or subscription does not currently have enough quota to start this app." >&2
              echo "Resolve the quota issue in Azure Portal by scaling the plan, stopping or deleting other apps in the same App Service plan, or requesting a quota increase, then rerun deployment." >&2
              exit 1
            fi

            echo "Azure web app state is '$app_state' on attempt $attempt. Waiting for it to start..."
            sleep 10
          done

          echo "Azure web app did not reach the Running state before deployment." >&2
          exit 1

      - name: Deploy to Azure Web App
        shell: bash
        run: |
          az webapp deploy \
            --name "${{ env.AZURE_WEBAPP_NAME }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --src-path ./release.zip \
            --type zip \
            --clean true \
            --restart true

      - name: Verify Azure startup command
        shell: bash
        run: |
          app_command_line=$(az webapp config show \
            --name "${{ env.AZURE_WEBAPP_NAME }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --query appCommandLine \
            --output tsv)

          if [ "$app_command_line" != "${{ env.AZURE_STARTUP_COMMAND }}" ]; then
            echo "Azure startup command mismatch. Expected '${{ env.AZURE_STARTUP_COMMAND }}' but got '$app_command_line'." >&2
            exit 1
          fi

      - name: Restart Azure Web App
        shell: bash
        run: |
          az webapp restart \
            --name "${{ env.AZURE_WEBAPP_NAME }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}"

      - name: Verify live site is not placeholder
        shell: bash
        run: |
          app_url="https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net"

          for attempt in 1 2 3 4 5 6; do
            response=$(curl --silent --show-error --location "$app_url")

            if [[ "$response" != *"Your web app is running and waiting for your content"* ]]; then
              exit 0
            fi

            echo "Placeholder page still active on attempt $attempt. Waiting for restart to finish..."
            sleep 20
          done

          echo "Azure app is still serving the placeholder page after deployment." >&2
          exit 1
