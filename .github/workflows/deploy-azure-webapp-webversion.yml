name: Deploy Azure Web App Webversion

on:
  push:
    branches:
      - webversion

env:
  NODE_VERSION: '20'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: webversion
    permissions:
      contents: read
      id-token: write

    if: github.ref == 'refs/heads/webversion'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck application
        run: npm run typecheck

      - name: Build application
        run: npm run build

      - name: Prune development dependencies
        run: npm prune --omit=dev

      - name: Prepare deployment package
        shell: bash
        run: |
          mkdir -p release
          tar \
            --exclude='./.git' \
            --exclude='./.github' \
            --exclude='./node_modules' \
            --exclude='./test' \
            --exclude='./release' \
            -cf - . | (cd release && tar -xf -)
          cp -R node_modules release/node_modules

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          package: ./release
          startup-command: npm start