# Azure Web App Deployment Workflow (OIDC)
# This workflow builds and deploys the app to Azure Web App using Azure Service Principal credentials (OIDC) on push to master.

name: Azure Web App Deploy (OIDC)

on:
  push:
    branches:
      - webversion

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'




      - name: Clean install (remove node_modules only)
        run: rm -rf node_modules

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Build project
        run: npm run build

      - name: 'Login to Azure using OIDC'
        uses: azure/login@v2
        with:
          creds: >-
            {"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          package: .
