# GitHub Actions workflow for deploying pro-chess to Azure Web App
# Uses Azure CLI login with Service Principal (no publish profile needed)

name: Azure Node.js Deploy

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install dependencies
        run: npm install
        working-directory: languagelearning/languagelearning-master

      - name: Build app
        run: npm run build
        working-directory: languagelearning/languagelearning-master

      - name: Zip artifact for deployment
        run: zip -r release.zip .
        working-directory: languagelearning/languagelearning-master

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          package: languagelearning/languagelearning-master/release.zip

# Required secrets:
# - AZURE_CLIENT_ID
# - AZURE_TENANT_ID
# - AZURE_SUBSCRIPTION_ID
# - AZURE_CLIENT_SECRET
# - AZURE_WEBAPP_NAME
