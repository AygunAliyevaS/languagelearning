# Azure Web App deployment (client secret auth)
# Runs on push to webversion; builds and deploys the app.

name: Azure Web App Deploy (Client Secret)

on:
  push:
    branches:
      - webversion

permissions:
  contents: read

env:
  NODE_VERSION: '20.x' # Azure App Service supports Node 20; 22 can fail to boot

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies (legacy peer deps)
        run: npm install --legacy-peer-deps

      - name: Build project
        run: npm run build

      - name: Package build artifacts (include node_modules to avoid runtime install)
        run: zip -r app.zip build node_modules package.json package-lock.json

      - name: Azure login (client secret)
        uses: azure/login@v3
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_WEBAPP_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_WEBAPP_CLIENT_SECRET }}",
              "tenantId": "${{ secrets.AZURE_WEBAPP_TENANT_ID }}",
              "subscriptionId": "${{ secrets.AZURE_WEBAPP_SUBSCRIPTION_ID }}"
            }

      - name: Configure app settings (timeout + disable Kudu build)
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az webapp config appsettings delete \
              --name "${{ secrets.AZURE_WEBAPP_NAME }}" \
              --resource-group "${{ secrets.AZURE_WEBAPP_RESOURCE_GROUP }}" \
              --setting-names PORT WEBSITES_PORT || true
            az webapp config appsettings set \
              --name "${{ secrets.AZURE_WEBAPP_NAME }}" \
              --resource-group "${{ secrets.AZURE_WEBAPP_RESOURCE_GROUP }}" \
              --settings WEBSITES_CONTAINER_START_TIME_LIMIT=1800 SCM_DO_BUILD_DURING_DEPLOYMENT=false

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          startup-command: node node_modules/@react-router/serve/dist/cli.js build/server/index.js
          package: app.zip
