name: Deploy Azure Web App Webversion

on:
  push:
    branches:
      - webversion

env:
  NODE_VERSION: '22.12.0'
  AZURE_NODE_RUNTIME: 'NODE|22-lts'
  AZURE_STARTUP_COMMAND: './node_modules/.bin/react-router-serve build/server/index.js'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: webversion
    permissions:
      contents: read

    if: github.ref == 'refs/heads/webversion'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck application
        run: npm run typecheck

      - name: Build application
        run: npm run build

      - name: Prune development dependencies
        run: npm prune --omit=dev

      - name: Prepare deployment package
        shell: bash
        run: |
          mkdir -p release
          tar \
            --exclude='./.git' \
            --exclude='./.github' \
            --exclude='./node_modules' \
            --exclude='./test' \
            --exclude='./release' \
            -cf - . | (cd release && tar -xf -)
          cp -R node_modules release/node_modules

      - name: Azure login
        uses: azure/login@v3
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'

      - name: Resolve Azure Web App resource group
        id: azure-webapp
        shell: bash
        run: |
          resource_group=$(az webapp list \
            --query "[?name=='${{ secrets.AZURE_WEBAPP_NAME }}'].resourceGroup | [0]" \
            --output tsv)

          if [ -z "$resource_group" ]; then
            echo "Unable to resolve resource group for web app '${{ secrets.AZURE_WEBAPP_NAME }}'." >&2
            exit 1
          fi

          echo "resource-group=$resource_group" >> "$GITHUB_OUTPUT"

      - name: Configure Azure Web App runtime
        shell: bash
        run: |
          az webapp config set \
            --name "${{ secrets.AZURE_WEBAPP_NAME }}" \
            --resource-group "${{ steps.azure-webapp.outputs.resource-group }}" \
            --linux-fx-version "${{ env.AZURE_NODE_RUNTIME }}" \
            --startup-file "${{ env.AZURE_STARTUP_COMMAND }}"

          az webapp config appsettings set \
            --name "${{ secrets.AZURE_WEBAPP_NAME }}" \
            --resource-group "${{ steps.azure-webapp.outputs.resource-group }}" \
            --settings AUTH_URL="https://${{ secrets.AZURE_WEBAPP_NAME }}.azurewebsites.net/api/auth"

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          package: ./release
          startup-command: ${{ env.AZURE_STARTUP_COMMAND }}
