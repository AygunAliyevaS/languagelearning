# Azure Web App Deployment Workflow (OIDC)
# This workflow builds and deploys the app to Azure Web App using Azure Service Principal credentials (OIDC) on push to master.

name: Azure Web App Deploy (OIDC)

on:
  push:
    branches:
      - webversion

permissions:
  id-token: write
  contents: read

env:
  NODE_VERSION: '22.x'
  AZURE_WEBAPP_NAME: 'azedili'
  AZURE_RESOURCE_GROUP: 'azdili'
  AZURE_TENANT_ID: 'f71cfc55-c062-43f2-be63-98cb4530c448'
  AZURE_CLIENT_ID: '5d2f25d0-ecc7-4e52-8db6-a5c6380718ae'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies (legacy peer deps)
        run: npm install --legacy-peer-deps

      - name: Build project
        run: npm run build

      - name: Login to Azure using OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_WEBVERSION_SUBSCRIPTION_ID }}

      - name: Preflight check - App exists
        run: |
          az webapp show --name "${{ env.AZURE_WEBAPP_NAME }}" --resource-group "${{ env.AZURE_RESOURCE_GROUP }}"

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: .
