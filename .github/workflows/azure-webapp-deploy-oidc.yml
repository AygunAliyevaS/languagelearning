# Azure Web App deployment (client secret auth)
# Runs on push to webversion; builds and deploys the app.

name: Azure Web App Deploy (Client Secret)

on:
  push:
    branches:
      - webversion

permissions:
  contents: read

env:
  NODE_VERSION: '22.x'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies (legacy peer deps)
        run: npm install --legacy-peer-deps

      - name: Build project
        run: npm run build

      - name: Azure login (client secret)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_WEBAPP_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_WEBAPP_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_WEBAPP_SUBSCRIPTION_ID }}
          client-secret: ${{ secrets.AZURE_WEBAPP_CLIENT_SECRET }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          package: .
